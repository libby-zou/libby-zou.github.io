<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libby Zou — Portfolio</title>
<meta name="description" content="An adventure-map portfolio: projects, experience, skills and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME
   ============================================================ */
:root{
  --cork:#e9dfc9; --cork-dark:#d6c8aa;
  --wood:#6a5a8c; --wood-dark:#3f3763; --wood-light:#8d7fb5;
  --paper:#fdf8ee; --paper-edge:#efe3c8; --ink:#2f2a45; --ink-soft:#6b6485;
  --gold:#ecc879; --ruby:#d98ba0; --sapphire:#6c9bd2; --emerald:#7fb69a; --amethyst:#a68bd6;
  --sea:#a9d0e8; --sea-dark:#86b8d6; --land:#f7efdc; --grass:#cfe3b4;
  --pin:#d98ba0;
  --shadow:0 2px 0 rgba(40,30,80,.06), 0 12px 26px rgba(40,30,90,.22);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#2c2752}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 47% 22%, #fff8d9 50%, transparent 51%),
    radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 81% 6%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 92% 26%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 6% 40%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 72% 36%, #fff 50%, transparent 51%),
    radial-gradient(ellipse at 50% 120%, #f6c9d6 0%, transparent 55%),
    radial-gradient(ellipse at 10% 70%, rgba(166,139,214,.45) 0%, transparent 50%),
    linear-gradient(180deg,#2c2752 0%, #4c4486 40%, #8a78b8 75%, #d7b6d0 100%);
  min-height:100vh; line-height:1.55;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:4px}
.wrap{max-width:1200px; margin:0 auto; padding:24px 20px 60px}
[hidden]{display:none !important}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)}}

/* ============================================================
   HANGING SIGN
   ============================================================ */
.sign-area{display:flex; justify-content:center; position:relative; padding-top:30px; margin-bottom:22px}
.sign-area::before,.sign-area::after{content:""; position:absolute; top:0; width:3px; height:38px; background:#241f3d}
.sign-area::before{left:calc(50% - 150px)} .sign-area::after{left:calc(50% + 147px)}
.sign{
  background:linear-gradient(180deg,var(--wood-light),var(--wood));
  border:4px solid var(--wood-dark); border-radius:14px;
  padding:12px 34px 14px; text-align:center; color:#fdf3dc; max-width:100%;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.08), 0 12px 24px rgba(0,0,0,.35);
  animation:sway 6s ease-in-out infinite; transform-origin:top center;
}
.sign h1{font-family:"Cormorant Garamond",serif; font-weight:700; margin:0; font-size:clamp(26px,5vw,44px); letter-spacing:.5px; text-shadow:0 3px 0 var(--wood-dark)}
.sign p{margin:2px 0 0; font-family:"Caveat",cursive; font-size:21px; color:#f3e3b0}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}

/* ============================================================
   BUTTONS / CHIPS / TAGS (shared)
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  text-decoration:none; font-weight:800; font-size:14px; border-radius:8px; padding:9px 12px;
  border:2px solid var(--wood-dark); background:#fffaf0; color:var(--ink); cursor:pointer;
  box-shadow:0 3px 0 var(--wood-dark); transition:transform .1s, box-shadow .1s; font-family:inherit;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 4px 0 var(--wood-dark)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--wood-dark)}
.btn.primary{background:var(--gold)}
.btn.resume-wip{cursor:default; background:#f3ecf8; color:#6b6485; border-style:dashed; box-shadow:none; font-weight:700}
.btn.resume-wip:hover,.btn.resume-wip:active{transform:none; box-shadow:none}
.btn svg{width:16px; height:16px}
.chip{
  border:2px solid #d9cfe9; background:#fff; border-radius:20px; padding:5px 12px; font-family:inherit;
  font-weight:700; font-size:13.5px; cursor:pointer; color:var(--ink); text-decoration:none;
}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--wood); border-color:var(--wood); color:#fdf3dc}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.tag{font-size:12.5px; font-weight:800; background:#efe6f6; border-radius:4px; padding:2px 8px; border:none; font-family:inherit; color:var(--ink)}
button.tag{cursor:pointer} button.tag:hover{background:var(--gold)}
.parchment{
  background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px;
  position:relative; box-shadow:var(--shadow), inset 0 0 40px rgba(150,130,200,.18);
}
.hand{font-family:"Caveat",cursive; font-weight:700; color:var(--wood)}
.section-label{font-family:"Caveat",cursive; font-size:24px; font-weight:700; margin:12px 0 6px; color:var(--wood)}

/* ============================================================
   WORLD MAP
   ============================================================ */
.map-frame{
  background:var(--wood-dark); padding:12px; border-radius:10px;
  box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 3px #241f3d;
}
.map-scroll{overflow-x:auto; border-radius:6px; -webkit-overflow-scrolling:touch}
.map-scroll svg{display:block; width:100%; min-width:760px; height:auto; background:#a9d0e8}
.map-hint{color:#fff; text-shadow:0 1px 6px rgba(40,30,90,.8); text-align:center; font-family:"Caveat",cursive; font-size:21px; margin:10px 0 0}
.node{cursor:pointer}
#worldMap .halo{paint-order:stroke fill; stroke:#fdf8ee; stroke-width:5px; stroke-linejoin:round; stroke-opacity:.95}
#worldMap .halo-sea{paint-order:stroke fill; stroke:#eef7fc; stroke-width:6px; stroke-linejoin:round; stroke-opacity:.95}
.node .medal{transition:transform .2s ease; transform-box:fill-box; transform-origin:center}
.node:hover .medal,.node:focus-visible .medal{transform:scale(1.12)}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:var(--gold); stroke-width:6}
.node .label-bg{transition:fill .2s}
.node:hover .label-bg,.node:focus-visible .label-bg{fill:var(--gold)}
.pulse{animation:ringpulse 2.2s ease-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes ringpulse{0%{transform:scale(1); opacity:.7}100%{transform:scale(1.7); opacity:0}}
.trail{stroke-dasharray:1 10; animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.bob2{animation:bob 3.2s ease-in-out infinite}
#hero{transition:transform .65s cubic-bezier(.45,.05,.3,1)}
#hero .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.waves path{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(14px)}}

.fast-travel{margin-top:20px}
.fast-travel h2{color:#fff; text-shadow:0 2px 10px rgba(40,30,90,.8); font-family:"Cormorant Garamond",serif; font-weight:700; font-size:22px; margin:0 0 10px; text-align:center}
.ft-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media (max-width:760px){.ft-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.ft-grid{grid-template-columns:1fr}}
.ft{
  display:flex; gap:12px; align-items:center; text-decoration:none; background:var(--paper);
  border-radius:10px; padding:12px; box-shadow:var(--shadow); transition:transform .15s;
}
.ft:hover{transform:translateY(-3px)}
.ft .icon{font-size:26px; width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:50%; background:#efe6f6; border:2px solid var(--wood-light)}
.ft b{display:block; font-size:15px}
.ft span{font-size:13px; color:var(--ink-soft); font-weight:600}
.ft .check{margin-left:auto; color:var(--emerald); font-weight:800}
.recruiter-bar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
  background:rgba(251,241,220,.95); border-radius:10px; padding:10px 14px; margin-bottom:16px; box-shadow:var(--shadow);
}
.recruiter-bar span{font-weight:800; font-size:14px}

/* ============================================================
   SUB-PAGE CHROME
   ============================================================ */
.topbar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  background:rgba(251,241,220,.95); border-radius:10px; padding:10px 12px; margin-bottom:18px; box-shadow:var(--shadow);
}
.topnav{display:flex; flex-wrap:wrap; gap:6px}
.page-head{display:flex; justify-content:center; margin-bottom:30px}
.banner{
  position:relative; margin:0; padding:10px 40px 12px; text-align:center;
  font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:700; font-size:clamp(24px,4vw,34px); line-height:1.15;
  color:#fffaf4; text-shadow:0 1px 1px rgba(110,40,70,.45);
  background:linear-gradient(180deg, #e7a0b3 0%, #d88aa0 42%, #c97a92 78%, #b96c84 100%);
  border-radius:3px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(110,40,70,.18), 0 6px 10px -4px rgba(40,25,70,.45);
}
.banner .banner-icon{font-style:normal; display:inline-block; transform:none}
.banner::before,.banner::after{
  content:""; position:absolute; top:12px; bottom:-12px; width:34px; z-index:-1;
  box-shadow:0 5px 8px -4px rgba(40,25,70,.4);
}
/* tails sit behind the ribbon; the darker strip next to the ribbon is the fold */
.banner::before{left:-24px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%);
  background:linear-gradient(to left, #8e4a63 0 10px, #b56a82 10px, #c47890 100%)}
.banner::after{right:-24px; clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%);
  background:linear-gradient(to right, #8e4a63 0 10px, #b56a82 10px, #c47890 100%)}
.page-head{position:relative; z-index:0}
.lead{color:#fff6dc; text-shadow:0 1px 8px rgba(40,30,90,.8); text-align:center; font-family:"Caveat",cursive; font-size:22px; margin:-8px 0 18px}
.next-stop{display:flex; justify-content:space-between; gap:10px; margin-top:26px; flex-wrap:wrap}

.board{
  background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.06) 0 1px, transparent 2px) 0 0/9px 9px,
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.08) 0 1px, transparent 2px) 0 0/13px 13px,
    linear-gradient(135deg,var(--cork),var(--cork-dark));
  border:14px solid var(--wood-dark);
  border-image:linear-gradient(135deg,#8d7fb5,#3f3763) 1;
  box-shadow:inset 0 0 30px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.4);
  padding:22px;
}

/* ============================================================
   ABOUT (Home Village)
   ============================================================ */
.about-grid{display:grid; grid-template-columns:310px 1fr; gap:22px; align-items:stretch}
@media (max-width:860px){.about-grid{grid-template-columns:1fr}}
.guild-card{
  background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 20px 20px; position:relative;
  background-image:linear-gradient(transparent 95%, rgba(130,110,170,.08) 95%); background-size:100% 28px;
}
.guild-card .ribbon{
  position:absolute; top:-12px; left:50%; transform:translateX(-50%);
  background:var(--ruby); color:#fff; font-weight:800; font-size:12px; letter-spacing:1.5px;
  padding:5px 16px; border-radius:3px; text-transform:uppercase; white-space:nowrap; box-shadow:0 3px 0 #b0687e;
}
.avatar{
  width:100px; height:100px; margin:8px auto 10px; border-radius:50%;
  display:grid; place-items:center; font-family:"Cormorant Garamond",serif; font-size:38px; color:#fff;
  background:conic-gradient(from 200deg,var(--amethyst),var(--sapphire),var(--emerald),var(--gold),var(--amethyst));
  border:4px solid #fff; box-shadow:0 0 0 3px var(--wood-light); overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover}
.guild-card h2{font-family:"Cormorant Garamond",serif; font-weight:700; text-align:center; margin:0; font-size:26px}
.guild-card .class{text-align:center; color:var(--ink-soft); font-weight:700; margin:0 0 6px}
.level{display:flex; justify-content:center; gap:6px; font-size:13px; font-weight:700; margin-bottom:12px; flex-wrap:wrap}
.level span{background:#efe6f6; border-radius:20px; padding:2px 10px}
.status{
  text-align:center; background:#e3f3e6; color:#25683b; border:2px dashed #7cc28f;
  border-radius:8px; padding:8px; font-weight:800; font-size:14px; margin-bottom:14px;
}
.status .dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:#2fae55; margin-right:6px; animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,174,85,.6)}70%{box-shadow:0 0 0 8px rgba(47,174,85,0)}100%{box-shadow:0 0 0 0 rgba(47,174,85,0)}}
.links{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.links .full{grid-column:1/-1}
.contact-text{font-size:12px; text-align:center; color:var(--ink-soft); margin-top:8px; word-break:break-all}
.story p{font-size:16px; margin:0 0 12px}
.feedback-note{font-style:italic; color:var(--ink-soft)}
.feedback-note a{color:#6a5a8c; font-weight:700; text-underline-offset:3px}
.story h3{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:26px; margin:0 0 8px}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:6px}
.fact{background:#f3ecf8; border-radius:8px; padding:10px 12px; font-size:14px}
.fact b{display:block; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft)}

/* ============================================================
   JOURNEY LOG (timeline)
   ============================================================ */
.timeline{position:relative; max-width:820px; margin:0 auto; padding-left:46px}
/* the dotted trail runs marker-to-marker, so it starts at the first icon and ends at the last */
.stop:not(:last-child)::after{
  content:""; position:absolute; left:-27.5px; top:33px; bottom:-55px; width:0;
  border-left:5px dotted #f3e3b0; z-index:0;
}
.stop{position:relative; margin-bottom:22px}
.stop .marker{
  position:absolute; left:-46px; top:12px; width:42px; height:42px; border-radius:50%;
  display:grid; place-items:center; font-size:20px; background:var(--paper); border:3px solid var(--wood-light);
  box-shadow:0 3px 0 var(--wood-dark); z-index:1;
}
.stop .when{font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft)}
.stop h3{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:22px; margin:2px 0 0; line-height:1.15}
.stop .where{font-weight:700; color:var(--wood); margin-bottom:6px}
.stop ul{margin:6px 0 0; padding-left:20px}
.stop li{font-size:15px}
.stop .kind{position:absolute; top:14px; right:16px}

/* ============================================================
   SKILL TREE
   ============================================================ */
.tree{display:grid; grid-template-columns:repeat(auto-fit,minmax(205px,1fr)); gap:14px}
.branch h3{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:22px; margin:0 0 12px; display:flex; gap:8px; align-items:center; white-space:nowrap; line-height:1.2; min-height:32px}
.skill-list{display:flex; flex-wrap:wrap; gap:7px}
.skill{
  display:inline-flex; align-items:center; gap:6px;
  background:#fffdf8; border:2px solid #ddd0ee; border-radius:999px; padding:5px 11px;
  font-family:inherit; font-size:14px; font-weight:800; color:var(--ink); cursor:pointer; text-align:left; line-height:1.25;
}
.skill:hover{border-color:var(--gold); background:#fbf3dd}
.skill .count{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:999px;
  background:#6a5a8c; color:#fff; font-size:11.5px; font-weight:800}
.skill[disabled]{cursor:default; color:#6b6485; font-weight:700; border-style:dashed}
.skill[disabled]:hover{border-color:#ddd0ee; background:#fffdf8}
.tree .branch{padding:18px 16px}
.skill-note{color:#fff; text-shadow:0 1px 6px rgba(40,30,90,.8); font-weight:700; text-align:center; font-size:14px; margin-top:16px}

/* ============================================================
   QUEST BOARD
   ============================================================ */
.board-top{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px}
.tally{flex:1 1 130px; background:var(--paper); border-radius:var(--radius); padding:10px 14px; box-shadow:var(--shadow); text-align:center; transform:rotate(var(--r,0deg))}
.tally b{display:block; font-family:"Cormorant Garamond",serif; font-weight:700; font-size:30px; line-height:1.1}
.tally span{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft)}
.filters{background:rgba(251,241,220,.94); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); margin-bottom:22px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.filters input{flex:1 1 200px; padding:9px 12px; border-radius:8px; border:2px solid #d9cfe9; background:#fff; font-family:inherit; font-size:15px; color:var(--ink)}
.filter-row{display:flex; flex-wrap:wrap; gap:6px; width:100%}
.filter-row small{font-weight:800; color:var(--ink-soft); align-self:center; margin-right:4px; font-size:12px; text-transform:uppercase; letter-spacing:1px}
.quests{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:30px 22px; padding-top:8px}
.quest-wrap{position:relative}
.quest{
  position:relative; background:var(--paper); border-radius:2px; padding:26px 18px 16px;
  box-shadow:var(--shadow); transform:rotate(var(--tilt,0deg)); cursor:pointer; text-align:left;
  border:none; font-family:inherit; color:inherit; width:100%; height:100%;
  transition:transform .2s ease;
  clip-path:polygon(0 2%,6% 0,20% 1.5%,38% 0,55% 1%,72% 0,88% 1.6%,100% 0,99.4% 30%,100% 62%,99% 100%,80% 98.8%,60% 100%,40% 99%,18% 100%,0 99%,.8% 70%,0 35%);
}
.quest::after{content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 28px rgba(150,130,200,.25)}
.quest:hover,.quest:focus-visible{transform:rotate(0deg) translateY(-6px) scale(1.02); z-index:2}
.pin{position:absolute; top:-6px; left:50%; width:18px; height:18px; margin-left:-9px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffd1dc,var(--pin) 55%,#b0687e); box-shadow:0 3px 3px rgba(0,0,0,.35); z-index:3}
.rank{position:absolute; top:10px; right:12px; width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
  font-family:"Cormorant Garamond",serif; font-size:22px; color:#fff; background:var(--rank-color);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2), 0 0 0 3px rgba(255,255,255,.6); transform:rotate(-12deg)}
.rank small{position:absolute; bottom:-14px; font-family:"Nunito"; font-size:9px; font-weight:800; color:var(--ink-soft); letter-spacing:1px}
.quest .kicker{font-size:11.5px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft)}
.quest h3{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:24px; margin:2px 0 6px 0; line-height:1.15}
.quest p.summary{font-size:14.5px; margin:0 0 12px; color:#4a4466}
.quest .tags{margin-bottom:12px}
.quest-foot{display:flex; justify-content:space-between; align-items:center; border-top:2px dashed #ddd0ee; padding-top:10px; font-size:13px; font-weight:700}
.reward{font-family:"Caveat",cursive; font-size:19px; color:var(--wood)}
.badge-status{font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.8px}
.st-complete{background:#e3f3e6; color:#25683b}
.st-progress{background:#fbf3dd; color:#8a5a00}
.st-legendary{background:#f1e4fb; color:#6a3a94}
.stamp{position:absolute; bottom:44px; right:10px; transform:rotate(-14deg); border:3px solid var(--stamp,#2f8a4d); color:var(--stamp,#2f8a4d);
  border-radius:6px; padding:1px 8px; font-weight:800; font-size:13px; letter-spacing:2px; opacity:.55; text-transform:uppercase; pointer-events:none}
.st-planned{background:#eee6fb; color:#5b4a8c}
.badge-status{white-space:nowrap}
.quest-foot{gap:8px}
.reward{white-space:nowrap}
.quest.planned{background:
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(166,139,214,.14) 27px 28px),
    #fbf8ff;}
.quest.planned::before{content:""; position:absolute; inset:8px; border:2px dashed #c9b9ea; pointer-events:none}
.quest.planned h3{font-style:italic}
.seal{position:absolute; top:-10px; left:50%; width:28px; height:28px; margin-left:-14px; border-radius:50%; z-index:3;
  display:grid; place-items:center; color:#fff; font-size:13px;
  background:radial-gradient(circle at 35% 35%,#c9b2f0,#8d6cc9 70%); box-shadow:0 3px 4px rgba(40,30,90,.35), inset 0 -2px 0 rgba(0,0,0,.15)}

.tavern{max-width:720px; margin:0 auto; text-align:center}

footer{text-align:center; color:#4a4470; font-weight:700; margin-top:34px; font-size:14px}

.sky-fx{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.wrap{position:relative; z-index:1}

function rng(seed){
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const f1 = n => n.toFixed(1);

function peak(x, y, s=1, snow=true){

  return `<g>

    <path d="M${f1(x-w)} ${y} L${x} ${f1(y-h)} L${f1(x+w)} ${y} Z" fill="#dcd6ee"/>
    <path d="M${x} ${f1(y-h)} L${f1(x+w)} ${y} L${f1(x+w*.12)} ${y} Q${f1(x+w*.1)} ${f1(y-h*.45)} ${x} ${f1(y-h)} Z" fill="#aea6d0"/>
    ${snow ? `<path d="M${f1(x-w*.3)} ${f1(y-h*.7)} L${x} ${f1(y-h)} L${f1(x+w*.3)} ${f1(y-h*.7)} L${f1(x+w*.14)} ${f1(y-h*.76)} L${f1(x+w*.02)} ${f1(y-h*.66)} L${f1(x-w*.12)} ${f1(y-h*.76)} Z" fill="#fff"/>` : ""}
    <path d="M${f1(x-w)} ${y} L${x} ${f1(y-h)} L${f1(x+w)} ${y}" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M${f1(x+w*.42)} ${f1(y-h*.3)} l${f1(-w*.12)} ${f1(h*.2)} M${f1(x+w*.62)} ${f1(y-h*.18)} l${f1(-w*.1)} ${f1(h*.14)} M${f1(x-w*.5)} ${f1(y-h*.12)} l${f1(w*.08)} ${f1(h*.1)}" stroke="${INK}" stroke-width="1.1" opacity=".45" stroke-linecap="round"/>

}

  for (let x = 14, i = 0; x < 986; x += 20, i++) if (i % 2 === 0){ const w = Math.min(20, 986 - x); segs += seg(x, 6, w, 8) + seg(x, 636, w, 8); }
  for (let y = 14, i = 0; y < 636; y += 20, i++) if (i % 2 === 0){ const h = Math.min(20, 636 - y); segs += seg(6, y, 8, h) + seg(986, y, 8, h); }
  const corner = (x, y) => `<g transform="translate(${x} ${y})"><rect x="-10" y="-10" width="20" height="20" fill="#fdf8ee" stroke="${INK}" stroke-width="1.6"/><path d="M0 -6 L6 0 L0 6 L-6 0 Z" fill="#d98ba0" stroke="${INK}" stroke-width="1.2"/></g>`;
  return `<g data-sea="1"><rect x="6" y="6" width="988" height="638" fill="none" stroke="${INK}" stroke-width="1.6"/>
    <rect x="14" y="14" width="972" height="622" fill="none" stroke="${INK}" stroke-width="1.2"/>
    ${segs}${corner(10,10)}${corner(990,10)}${corner(10,640)}${corner(990,640)}</g>`;
}

/* smooth curve through points (Catmull-Rom → cubic Bézier) */
function trailPath(pts){
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    d += ` C${f1(p1.x + (p2.x - p0.x)/6)} ${f1(p1.y + (p2.y - p0.y)/6)} ${f1(p2.x - (p3.x - p1.x)/6)} ${f1(p2.y - (p3.y - p1.y)/6)} ${p2.x} ${p2.y}`;
  }
  return d;
}

/* size every label box to its text, with even padding on both sides */
function fitMapLabels(){
  const svg = document.getElementById("worldMap");
  if (!svg || svg.closest("[hidden]")) return;
  svg.querySelectorAll("g.ribbon").forEach(g => {
    const t = g.querySelector("text"), rect = g.querySelector("rect.label-bg");
    const cx = +g.dataset.cx, y0 = +g.dataset.y0, lh = +g.dataset.lh;
    const w = Math.ceil(t.getBBox().width) + 44, x0 = cx - w/2;
    rect.setAttribute("x", x0); rect.setAttribute("width", w);
    [[-1, ".tail-l"], [1, ".tail-r"]].forEach(([side, sel]) => {
      const xa = side < 0 ? x0 - 13 : x0 + w + 13, xb = side < 0 ? x0 + 8 : x0 + w - 8, notch = side < 0 ? xa + 6 : xa - 6;
      g.querySelector(sel).setAttribute("d", `M${xb} ${y0+6} L${xa} ${y0+6} L${notch} ${y0+6+lh/2} L${xa} ${y0+6+lh} L${xb} ${y0+6+lh} Z`);
    });
  });
  svg.querySelectorAll("g.pill").forEach(g => {
    const t = g.querySelector("text"), rect = g.querySelector("rect"), cx = +g.dataset.cx;
    const w = Math.ceil(t.getBBox().width) + 30;
    rect.setAttribute("x", cx - w/2); rect.setAttribute("width", w);
  });
  const lake = svg.querySelector("#lake"), name = svg.querySelector("#lakeName");
  if (lake && name){ const need = name.getBBox().width / 2 + 16; if (+lake.getAttribute("rx") < need) lake.setAttribute("rx", Math.ceil(need)); }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMapLabels);

const heroY = r => r.y - (r.main ? 100 : 60);
let travelling = false;
function travelTo(id){
  const r = RMAP[id]; if (!r || travelling) return;
  const hero = document.getElementById("hero");
  if (reduceMotion){ location.hash = id; return; }
  travelling = true;
  hero.style.transform = `translate(${r.x}px, ${heroY(r)}px)`;
  setTimeout(() => { travelling = false; location.hash = id; }, 700);
}

function wireContactForm(){
  const form = document.getElementById("contactForm"), status = document.getElementById("formStatus");
  if (!form) return;
  const L = ADVENTURER.links || {};
  const say = (msg, kind) => { status.textContent = msg; status.className = "form-status " + (kind || ""); };
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    if (data.botcheck) return;                                   // spam bots tick hidden boxes
    if (!data.name.trim() || !data.message.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email.trim())){
      say("Please fill in your name, a valid email and a message.", "error"); return;
    }
    if (!L.formKey){                                              // no key yet: fall back to the visitor's email app
      const body = `${data.message}\n\n— ${data.name} (${data.email})`;
      window.location.href = `mailto:${L.email}?subject=${encodeURIComponent("Message from your portfolio")}&body=${encodeURIComponent(body)}`;
      say("Opening your email app with your message…", "ok"); return;
    }
    const btn = form.querySelector(".send"); btn.disabled = true; say("Sending…");
    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          access_key: L.formKey, subject: `Portfolio message from ${data.name}`, from_name: "Portfolio contact form",
          name: data.name, email: data.email, replyto: data.email, message: data.message,
        }),
      });
      const out = await res.json().catch(() => ({}));
      if (res.ok && out.success){ form.reset(); say("✨ Message sent! Thank you, I'll get back to you soon.", "ok"); }
      else throw new Error(out.message || "failed");
    } catch {
      say(`Sorry, that didn't go through. Please email me directly at ${L.email}.`, "error");
    } finally { btn.disabled = false; }
  });
}

function renderTallies(){
  const started = QUESTS.filter(q => q.status !== "planned");
  const done = started.filter(q => q.status !== "progress").length;
  const active = started.filter(q => q.status === "progress").length;
  const planned = QUESTS.length - started.length;
  const skills = new Set(started.flatMap(q => q.tags || [])).size;
  document.getElementById("tallies").innerHTML = [["Quests cleared",done],["In progress",active],["Yet to come",planned],["Skills used",skills]]
    .map(([l,v],i) => `<div class="tally" style="--r:${[-1.5,1,-.6,1.4][i]}deg"><b>${v}</b><span>${l}</span></div>`).join("");
}

const state = { q:"", status:"all", tag:"all", cat:"all" };
const CATEGORIES = [["all","All"],["work","💼 Work"],["research","🔬 Research"],["club","🤝 Clubs"],["hackathon","🏆 Hackathons"],["class","🎓 Class projects"],["personal","🌱 Personal projects"]];
function renderFilters(){
  const cf = document.getElementById("catFilters");
  cf.insertAdjacentHTML("beforeend", CATEGORIES.map(([v,l]) => `<button class="chip" type="button" data-cat="${v}" aria-pressed="${v === "all"}">${l}</button>`).join(""));
  cf.addEventListener("click", e => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    state.cat = b.dataset.cat;
    cf.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    renderQuests();
  });
  const sf = document.getElementById("statusFilters");
  sf.insertAdjacentHTML("beforeend", [["all","All"],["legendary","⭐ Featured"],["complete","✔ Completed"],["progress","⏳ In progress"],["planned","✨ Yet to come"]]
    .map(([v,l]) => `<button class="chip" type="button" data-status="${v}" aria-pressed="${v === "all"}">${l}</button>`).join(""));
  renderTagChips();
  const tf = document.getElementById("tagFilters");
  sf.addEventListener("click", e => {
    const b = e.target.closest("[data-status]"); if (!b) return;
    state.status = b.dataset.status;
    sf.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    renderQuests();
  });
  tf.addEventListener("click", e => { const b = e.target.closest("[data-tag]"); if (b) setTag(b.dataset.tag); });
  document.getElementById("search").addEventListener("input", e => { state.q = e.target.value.toLowerCase().trim(); renderQuests(); });
}
const FILTER_MAP = Object.fromEntries(SKILL_FILTERS);
const matchesTag = (q, t) => t === "all" || (FILTER_MAP[t] || [t]).some(x => (q.tags || []).includes(x) || (q.softSkills || []).includes(x));
function renderTagChips(){
  const tf = document.getElementById("tagFilters");
  const chips = SKILL_FILTERS.filter(([label]) => QUESTS.some(q => matchesTag(q, label))).map(([label]) => label);
  const extra = state.tag !== "all" && !FILTER_MAP[state.tag] ? state.tag : null;   // a specific skill picked in the library
  tf.innerHTML = `<small>Skills</small>` +
    [["all","All"], ...chips.map(c => [c,c])].map(([v,l]) =>
      `<button class="chip" type="button" data-tag="${esc(v)}" aria-pressed="${state.tag === v}">${esc(l)}</button>`).join("") +
    (extra ? `<button class="chip" type="button" data-tag="all" aria-pressed="true" title="Clear this filter">🔎 ${esc(extra)} ✕</button>` : "");
}
function setTag(t){
  state.tag = t;
  renderTagChips();
  renderQuests();
}

const order = { legendary:0, complete:1, progress:2, planned:3 };
function questCard(q, n){
  const s = STATUS[q.status] || STATUS.complete, planned = q.status === "planned";
  return `<div class="quest-wrap">${planned ? `<span class="seal" aria-hidden="true">✦</span>` : `<span class="pin" aria-hidden="true"></span>`}
    <button class="quest${planned ? " planned" : ""}" type="button" data-i="${q._i}" style="--tilt:${[-2,1.5,-1,2,-1.5,1][n % 6]}deg" aria-label="Open quest: ${esc(q.title)}">
      <div class="kicker">${esc(q.type)}${q.date ? " · " + esc(q.date) : ""}</div>
      <h3>${esc(q.title)}</h3>
      <p class="summary">${esc(q.summary)}</p>
      ${q.tags?.length ? `<div class="tags">${q.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="quest-foot"><span class="badge-status ${s.cls}">${s.label}</span>${planned ? "" : `<span class="reward">read more →</span>`}</div>
    </button></div>`;
}
function renderQuests(){
  const list = QUESTS.map((q,i) => ({...q, _i:i}))
    .filter(q => state.status === "all" || q.status === state.status)
    .filter(q => state.cat === "all" || [].concat(q.category).includes(state.cat))
    .filter(q => matchesTag(q, state.tag))
    .filter(q => !state.q || [q.title,q.type,q.summary,q.objective,...(q.tags||[]),...(q.whatIDid||[]),...(q.plan||[])].join(" ").toLowerCase().includes(state.q))
    // finished & in-progress quests: newest first · ideas yet to come: soonest first (undated last)
    .sort((a,b) => a.status === "planned" && b.status === "planned"
      ? (a.sort || "9999").localeCompare(b.sort || "9999")
      : (b.sort || "").localeCompare(a.sort || ""));
  const el = document.getElementById("quests");
  if (!list.length){ el.innerHTML = `<div class="empty">🍃 No quests found down this path. Try another spell!</div>`; return; }
  const accepted = list.filter(q => q.status !== "planned"), planned = list.filter(q => q.status === "planned");
  el.innerHTML = accepted.map(questCard).join("") +
    (planned.length ? `<div class="board-divider"><h3>✨ Adventures Yet to Come</h3><p>Waiting for the quest to begin.</p></div>` + planned.map(questCard).join("") : "");
}

const overlay = document.getElementById("overlay"), scrollEl = document.getElementById("scroll");
let lastFocus = null;
function openQuest(i){
  const q = QUESTS[i]; if (!q) return;
  const s = STATUS[q.status] || STATUS.complete, planned = q.status === "planned";
  lastFocus = document.activeElement;
  scrollEl.innerHTML = `
    <button class="close" type="button" aria-label="Close">✕</button>
    <div class="kicker">${esc(q.type)} · <span class="badge-status ${s.cls}">${s.label}</span></div>
    <h2 id="mTitle">${esc(q.title)}</h2>
    <p>${esc(q.summary)}</p>
    ${q.image && safeUrl(q.image) ? `<img class="shot" src="${esc(q.image)}" alt="Screenshot of ${esc(q.title)}">` : ""}
    <div class="meta">
      ${q.role ? `<div><small>Party</small><b>${esc(q.role)}</b></div>` : ""}
      ${q.duration ? `<div><small>${planned ? "Estimated time" : "Time spent"}</small><b>${esc(q.duration)}</b></div>` : ""}
      ${q.date ? `<div><small>${planned ? "Starting" : "When"}</small><b>${esc(q.date)}</b></div>` : ""}
    </div>
    ${q.objective ? `<h4>🎯 Quest objective</h4><p>${esc(q.objective)}</p>` : ""}
    ${q.plan?.length ? `<h4>🗺️ The plan</h4><ul>${q.plan.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${q.learn?.length ? `<h4>✨ What I hope to learn</h4><ul class="loot">${q.learn.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${q.whatIDid?.length ? `<h4>⚔️ What I did</h4><ul>${q.whatIDid.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${q.loot?.length ? `<h4>💰 Loot & results</h4><ul class="loot">${q.loot.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${q.tags?.length ? `<h4>🧰 ${planned ? "Equipment I'll bring" : "Equipment"}</h4><div class="tags">${q.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${q.softSkills?.length ? `<h4>🤝 Party skills</h4><div class="tags">${q.softSkills.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    <div class="actions">
      ${planned && !q.github ? `<a class="btn primary" href="#tavern">🏮 Interested? Let's talk</a>` : q.github ? `<a class="btn primary" href="${esc(safeUrl(q.github))}" target="_blank" rel="noopener">${ICONS.github} View the code</a>` : (ADVENTURER.links.github && !q.noCode ? `<a class="btn primary" href="${esc(safeUrl(ADVENTURER.links.github))}" target="_blank" rel="noopener">${ICONS.github} See my GitHub</a>` : "")}
      ${q.demo ? `<a class="btn" href="${esc(safeUrl(q.demo))}" target="_blank" rel="noopener">🚀 Live demo</a>` : ""}
    </div>`;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  scrollEl.querySelector(".close").focus();
  try { history.replaceState(null, "", "#quest-" + i); } catch {}
}
function closeQuest(){
  overlay.classList.remove("open");
  document.body.style.overflow = "";
  try { history.replaceState(null, "", "#quests"); } catch {}
  if (lastFocus) lastFocus.focus();
}
document.getElementById("quests").addEventListener("click", e => { const b = e.target.closest(".quest"); if (b) openQuest(+b.dataset.i); });
overlay.addEventListener("click", e => { if (e.target === overlay || e.target.closest(".close")) closeQuest(); });
document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("open")) return;
  if (e.key === "Escape") closeQuest();
  if (e.key === "Tab"){
    const f = scrollEl.querySelectorAll("a,button"); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

function route(){
  let id = location.hash.slice(1) || "map";
  let questIdx = null;
  const m = id.match(/^quest-(\d+)$/);
  if (m){ questIdx = +m[1]; id = "quests"; }
  if (id !== "map" && !RMAP[id]) id = "map";

  document.querySelectorAll(".view").forEach(v => v.hidden = v.dataset.view !== id);
  const sub = id !== "map";
  document.getElementById("subChrome").hidden = !sub;
  const next = document.getElementById("nextStop");
  next.hidden = !sub;

  if (sub){
    const r = RMAP[id];
    document.getElementById("pageTitle").innerHTML = `<span class="banner-icon" aria-hidden="true">${r.icon}</span> ${esc(r.name)}`;
    document.getElementById("pageLead").textContent = r.lead;
    renderTopnav(id);
    const i = REGIONS.indexOf(r), prev = REGIONS[i - 1], nxt = REGIONS[i + 1];
    next.innerHTML = `${prev ? `<a class="btn" href="#${prev.id}">← ${prev.icon} ${esc(prev.name)}</a>` : `<a class="btn" href="#map">← 🗺️ World map</a>`}
      ${nxt ? `<a class="btn primary" href="#${nxt.id}">Next stop: ${nxt.icon} ${esc(nxt.name)} →</a>` : `<a class="btn primary" href="#map">Back to the map 🗺️</a>`}`;
    visited.add(id); store.set("realm-visited", [...visited]); store.set("realm-last", id);
    document.title = `${r.name} — ${ADVENTURER.name}`;
  } else {
    document.title = `${ADVENTURER.name} — Portfolio`;
    refreshMapState();
  }
  if (questIdx !== null) openQuest(questIdx);
  else if (overlay.classList.contains("open")){ overlay.classList.remove("open"); document.body.style.overflow = ""; }
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function refreshMapState(){
  const svg = document.getElementById("worldMap");
  // rebuild map so visited checkmarks and hero position are current
  svg.querySelectorAll(":scope > :not(desc)").forEach(n => n.remove());
  const fresh = svg.cloneNode(true); svg.replaceWith(fresh);   // drop old listeners
  renderMap(); renderFastTravel();
}

/* ---------------------------------------------------------------
   DRIFTING PETALS & SPARKLES
   --------------------------------------------------------------- */
function skyFx(){
  const fx = document.getElementById("skyFx");
  let html = "";
  for (let i = 0; i < 14; i++)
    html += `<span class="twinkle" style="left:${(i*37)%100}%;top:${(i*23)%60}%;animation-delay:${(i*.37)%3}s">✦</span>`;
  if (!reduceMotion) for (let i = 0; i < 22; i++){
    const kind = i % 3 ? "petal" : "sparkle";
    html += `<span class="mote ${kind}" style="left:${(i*47)%100}%;--dx:${(i%2?1:-1)*(40+i*4)}px;animation-duration:${14+(i*7)%12}s;animation-delay:${-(i*1.7)}s"></span>`;
  }
  fx.innerHTML = html;
}
